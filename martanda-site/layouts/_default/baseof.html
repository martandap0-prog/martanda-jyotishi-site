<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  {{ if .IsHome }}<meta name="description" content="{{ .Site.Params.tagline }}">{{ else }}<meta name="description" content="{{ .Summary | plainify | truncate 150 }}">{{ end }}
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ "/" | relURL }}"><h1>MĀRTAṆḌA JYOTIṢĪ</h1></a>
    <p>{{ .Site.Params.tagline }}</p>
  </header>
  <nav class="site-nav">
    <a href="{{ "/" | relURL }}">Home</a>
    <a href="{{ "/posts/" | relURL }}">Articles</a>
  </nav>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    &copy; {{ now.Year }} Mārtaṇḍa Jyotiṣī. Classical Jyotiṣa in the Parāśara &amp; Jaimini traditions.
  </footer>
</body>
</html>
